services:
  web:
    image: ${DOCKERHUB_NAMESPACE}/clickfast-web:${IMAGE_TAG}
    container_name: clickfast-web
    ports:
      - "${WEB_PORT}:8080"
    networks:
      - clickfast-net

  api:
    image: ${DOCKERHUB_NAMESPACE}/clickfast-api:${IMAGE_TAG}
    container_name: clickfast-api
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      API_PORT: ${API_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT}:${API_PORT}"
    networks:
      - clickfast-net

  stats-api:
    image: ${DOCKERHUB_NAMESPACE}/clickfast-stats-api:${IMAGE_TAG}
    container_name: clickfast-stats-api
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      STATS_API_PORT: ${STATS_API_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${STATS_API_PORT}:${STATS_API_PORT}"
    networks:
      - clickfast-net

  postgres:
    image: postgres:16-alpine
    container_name: clickfast-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - clickfast-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - clickfast-net

  adminer:
    image: adminer:4.8.1
    container_name: clickfast-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - clickfast-net

volumes:
  clickfast-pg-data:
    name: clickfast-pg-data
    external: true

networks:
  clickfast-net:
    name: clickfast-net
